[package]
name = "ceoai-spider-sidecar"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
spider = { version = "=2.53.9", default-features = false, features = ["basic"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
url = "2"
