[package]
name = "ceoai-spider-sidecar"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
reqwest = { version = "0.13", features = ["stream"] }
scraper = "0.22"
sha2 = "0.10"
spider = { version = "=2.53.9", default-features = false, features = ["basic", "remote_addr", "fetch_engine"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net"] }
url = "2"
