name: CEOAI Worker verification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ceoai-worker-main
  cancel-in-progress: true

jobs:
  verify:
    name: Fast syntax and regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run one consolidated verification pass
        run: npm run verify
      - name: Validate production bindings with Wrangler 4 (dry run only)
        shell: bash
        run: |
          set -o pipefail
          npm exec --yes --package wrangler@4.157.0 -- wrangler deploy --dry-run --config wrangler.toml 2>&1 | tee /tmp/ceoai-wrangler-dry-run.log
          grep -q "RATE_LIMITER" /tmp/ceoai-wrangler-dry-run.log || {
            echo "::error::RATE_LIMITER binding is missing from Wrangler's resolved configuration."
            exit 1
          }
          grep -q "SPIDER_QUEUE" /tmp/ceoai-wrangler-dry-run.log || {
            echo "::error::SPIDER_QUEUE binding is missing from Wrangler's resolved configuration."
            exit 1
          }
