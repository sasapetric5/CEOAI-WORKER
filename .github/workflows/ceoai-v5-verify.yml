name: CEOAI Worker verification

on:
  push:
    branches:
      - main
      - v5.0
  pull_request:
    branches:
      - main
      - v5.0
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ceoai-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Syntax and regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify source syntax and tests
        run: npm run verify

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: sidecar/spider

      - name: Verify Spider sidecar
        run: cargo test --manifest-path sidecar/spider/Cargo.toml

      - name: Verify Cloudflare Worker transport security gate (native runtime tests)
        run: cargo test --manifest-path sidecar/spider-cloudflare-worker/transport-policy/Cargo.toml

      - name: Live smoke test against approved public fixture
        run: node sidecar/spider/scripts/live-smoke-test.mjs
