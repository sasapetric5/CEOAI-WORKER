name: CEOAI Worker verification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ceoai-worker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Fast syntax and regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out proposed commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run one consolidated verification pass
        run: npm run verify
      - name: Install Rust and WASM target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Build TUF verifier for Worker bundling
        run: npm run build:tuf
      - name: Validate production bindings with Wrangler 4 (dry run only)
        shell: bash
        run: |
          set -o pipefail
          npm exec --yes --package wrangler@4.157.0 -- wrangler deploy --dry-run --config wrangler.toml 2>&1 | tee /tmp/ceoai-wrangler-dry-run.log
          for binding in KV_MEMORY RATE_LIMITER SECURITY_DO SPIDER_QUEUE SPIDER_LEDGER WORKFLOW_TASKS CAPABILITY_AUTHORITY; do
            grep -q "$binding" /tmp/ceoai-wrangler-dry-run.log || {
              echo "::error::$binding binding is missing from Wrangler's resolved configuration."
              exit 1
            }
          done
