name: CEOAI Sigstore TUF Worker verification

on:
  push:
    branches: [main]
    paths:
      - "security/tuf-worker/**"
      - "src/agent/cloudflare-tuf-metadata-store.mjs"
      - "src/agent/sigstore-tuf-repository-fetcher.mjs"
      - "src/agent/sigstore-tuf-trust-root-provider.mjs"
      - "src/agent/skill-security-firewall.mjs"
      - "src/agent/cloudflare-sigstore-tuf-firewall.mjs"
      - "src/durable-objects/security-do.mjs"
      - "test/sigstore-tuf-provider.test.mjs"
      - "test/security-do.test.mjs"
      - "test/skill-security-firewall.test.mjs"
      - "scripts/verify-tuf-wasm.mjs"
      - ".github/workflows/skill-tuf-worker.yml"
  pull_request:
    branches: [main]
    paths:
      - "security/tuf-worker/**"
      - "src/agent/cloudflare-tuf-metadata-store.mjs"
      - "src/agent/sigstore-tuf-repository-fetcher.mjs"
      - "src/agent/sigstore-tuf-trust-root-provider.mjs"
      - "src/agent/skill-security-firewall.mjs"
      - "src/agent/cloudflare-sigstore-tuf-firewall.mjs"
      - "src/durable-objects/security-do.mjs"
      - "test/sigstore-tuf-provider.test.mjs"
      - "test/security-do.test.mjs"
      - "test/skill-security-firewall.test.mjs"
      - "scripts/verify-tuf-wasm.mjs"
      - ".github/workflows/skill-tuf-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tuf-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pinned commit
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Rust and WASM target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Record official bootstrap root digest
        run: sha256sum security/tuf-worker/bootstrap-root.json
      - name: Run TUF trust-chain regression tests
        run: cargo test --manifest-path security/tuf-worker/Cargo.toml
      - name: Compile optimized Worker WASM artifact
        run: cargo build --release --manifest-path security/tuf-worker/Cargo.toml --target wasm32-unknown-unknown
      - name: Exercise the real WASM ABI in Node
        run: node scripts/verify-tuf-wasm.mjs
