name: CEOAI skill intake audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ceoai-skill-intake-audit
  cancel-in-progress: true

jobs:
  audit:
    name: Verify pinned skill sources
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out v5.0
        uses: actions/checkout@v7
        with:
          ref: v5.0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Verify upstream source integrity and calculate SHA-256
        run: node scripts/verify-skill-intake.mjs
      - name: Preserve audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ceoai-skill-intake-audit
          path: .reports/skill-intake-verification.json
          if-no-files-found: warn
          retention-days: 14
