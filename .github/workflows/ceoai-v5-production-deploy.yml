name: CEOAI V5.1 production deploy

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: "Type deploy to authorize updating the existing ceoai-worker production Worker"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ceoai-v5-production-deploy
  cancel-in-progress: false

jobs:
  verify:
    name: Full verification before deployment
    if: ${{ inputs.confirm_production == 'deploy' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the exact workflow-dispatch commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run complete Worker verification (including Spider, Queue, HMAC and Security DO tests)
        run: npm run verify
      - name: Validate Cloudflare bindings with Wrangler 4
        shell: bash
        run: |
          set -o pipefail
          npm exec --yes --package wrangler@4.157.0 -- wrangler deploy --dry-run --config wrangler.toml 2>&1 | tee /tmp/ceoai-wrangler-dry-run.log
          grep -q "RATE_LIMITER" /tmp/ceoai-wrangler-dry-run.log || {
            echo "::error::RATE_LIMITER binding is missing from Wrangler's resolved configuration."
            exit 1
          }
          grep -q "SPIDER_QUEUE" /tmp/ceoai-wrangler-dry-run.log || {
            echo "::error::SPIDER_QUEUE binding is missing from Wrangler's resolved configuration."
            exit 1
          }

  deploy:
    name: Deploy existing ceoai-worker Worker
    needs: verify
    if: ${{ needs.verify.result == 'success' && inputs.confirm_production == 'deploy' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the exact verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Validate Cloudflare credentials are configured
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_API_TOKEN" ]; then
            echo "::error::GitHub Actions secret CLOUDFLARE_API_TOKEN is not configured."
            exit 1
          fi
          if [ -z "$CF_ACCOUNT_ID" ]; then
            echo "::error::GitHub Actions variable CLOUDFLARE_ACCOUNT_ID is not configured."
            exit 1
          fi
      - name: Deploy with Wrangler 4
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npm exec --yes --package wrangler@4.157.0 -- wrangler deploy --config wrangler.toml
