name: CEOAI Worker production deploy

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: "Type deploy to authorize updating the existing ceoai-worker production Worker"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ceoai-v5-production-deploy
  cancel-in-progress: false

jobs:
  verify:
    name: Full verification before deployment
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm_production == 'deploy' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the exact workflow-dispatch commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run complete Worker verification (including Spider, Queue, HMAC and Security DO tests)
        run: npm run verify
      - name: Install Rust and WASM target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Build TUF verifier for Worker bundling
        run: npm run build:tuf
      - name: Validate Cloudflare bindings with Wrangler 4
        shell: bash
        run: |
          set -o pipefail
          npm exec --yes --package wrangler@4.157.0 -- wrangler deploy --dry-run --config wrangler.toml 2>&1 | tee /tmp/ceoai-wrangler-dry-run.log
          for binding in KV_MEMORY RATE_LIMITER SECURITY_DO SPIDER_QUEUE SPIDER_LEDGER WORKFLOW_TASKS CAPABILITY_AUTHORITY; do
            grep -q "$binding" /tmp/ceoai-wrangler-dry-run.log || {
              echo "::error::$binding binding is missing from Wrangler's resolved configuration."
              exit 1
            }
          done

  deploy:
    name: Deploy existing ceoai-worker Worker
    needs: verify
    if: ${{ github.ref == 'refs/heads/main' && needs.verify.result == 'success' && inputs.confirm_production == 'deploy' }}
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the exact verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Rust and WASM target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Build TUF verifier for Worker bundling
        run: npm run build:tuf
      - name: Validate Cloudflare credentials are configured
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_API_TOKEN" ]; then
            echo "::error::GitHub Actions secret CLOUDFLARE_API_TOKEN is not configured."
            exit 1
          fi
          if [ -z "$CF_ACCOUNT_ID" ]; then
            echo "::error::GitHub Actions variable CLOUDFLARE_ACCOUNT_ID is not configured."
            exit 1
          fi
      - name: Deploy with Wrangler 4
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npm exec --yes --package wrangler@4.157.0 -- wrangler deploy --config wrangler.toml
