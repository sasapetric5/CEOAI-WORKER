name: CEOAI Skill Security Firewall

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      candidate_id:
        description: "Immutable CEOAI candidate ID"
        required: true
        type: string
      repository:
        description: "Approved public source repository owner/name"
        required: true
        type: string
      skill_path:
        description: "Exact SKILL.md path inside the pinned source repository"
        required: true
        type: string
      commit:
        description: "Full immutable source commit SHA"
        required: true
        type: string
      blob_sha:
        description: "Git blob SHA of the exact SKILL.md"
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  security-events: write

concurrency:
  group: ceoai-skill-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Scan each pinned external Skill candidate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout pinned commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Checkout exact external Skill source
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.commit }}
          path: .scanner-source
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pipx and scanner tools
        run: |
          python -m pip install --user pipx
          python -m pipx ensurepath
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/pipx" install semgrep
          "$HOME/.local/bin/pipx" install owasp-depscan

      - name: Install Gitleaks
        run: |
          VERSION=8.24.2
          curl --fail --silent --show-error --location "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Install ClamAV and update signatures
        run: |
          sudo apt-get update
          sudo apt-get install --yes clamav clamav-freshclam
          # Ubuntu may start freshclam as a daemon and hold its log lock.
          sudo systemctl stop clamav-freshclam.service || true
          sudo freshclam --stdout --verbose
          clamscan --version

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.8.2

      - name: Prepare scanner report directory
        run: mkdir -p .reports/skill-security

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          source-root: ${{ github.event_name == 'workflow_dispatch' && '.scanner-source' || '.' }}

      - name: Analyze repository with CodeQL
        uses: github/codeql-action/analyze@v3
        with:
          output: ${{ github.workspace }}/.reports/skill-security/codeql.sarif
          upload: false

      - name: Run CEOAI scanner aggregation and signed evaluator
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          CODEQL_SARIF: .reports/skill-security/codeql.sarif
          SKILL_SCAN_ROOT: ${{ github.event_name == 'workflow_dispatch' && '.scanner-source' || 'skills/catalog/external' }}
          SKILL_SCAN_SOURCE_ROOT: ${{ github.event_name == 'workflow_dispatch' && '.scanner-source' || '.' }}
          SKILL_CANDIDATE_ID: ${{ inputs.candidate_id }}
          SKILL_CANDIDATE_REPOSITORY: ${{ inputs.repository }}
          SKILL_CANDIDATE_PATH: ${{ inputs.skill_path }}
          SKILL_CANDIDATE_COMMIT: ${{ inputs.commit }}
          SKILL_CANDIDATE_BLOB_SHA: ${{ inputs.blob_sha }}
        run: node scripts/skill-security-scan.mjs

      - name: Preserve signed Skill scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ceoai-skill-security-${{ github.run_id }}
          path: .reports/skill-security/
          if-no-files-found: warn
          retention-days: 30
