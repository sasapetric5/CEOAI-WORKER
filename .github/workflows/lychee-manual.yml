name: CEOAI Lychee link audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ceoai-lychee-manual
  cancel-in-progress: true

jobs:
  link-audit:
    name: Check approved CEOAI domain links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch the fixed homepage safely
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --connect-timeout 8 \
            --max-time 30 \
            --retry 2 \
            --retry-all-errors \
            --retry-delay 2 \
            --max-filesize 1048576 \
            --proto '=https' \
            --output index.html \
            https://ceoai.dev
          test -s index.html
          grep -Eqi '<html|<!doctype' index.html

      - name: Check links found in the homepage
        id: lychee
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # v2.8.0
        with:
          args: >-
            --base https://ceoai.dev
            --timeout 10
            --threads 4
            --max-retries 1
            --include '^https://ceoai\.dev(/|$)'
            index.html
          output: lychee-report.md
          fail: false
          failIfEmpty: false

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ceoai-lychee-report
          path: lychee-report.md
          if-no-files-found: warn
          retention-days: 7
