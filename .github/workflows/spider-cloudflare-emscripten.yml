name: Spider Cloudflare Emscripten preview

on:
  push:
    branches:
      - v5.0
    paths:
      - "sidecar/spider/**"
      - "sidecar/spider-cloudflare-worker/**"
      - ".github/workflows/spider-cloudflare-emscripten.yml"
  pull_request:
    branches:
      - v5.0
    paths:
      - "sidecar/spider/**"
      - "sidecar/spider-cloudflare-worker/**"
      - ".github/workflows/spider-cloudflare-emscripten.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spider-cloudflare-emscripten-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guarded-transport-tests:
    name: Guarded transport and crawler security tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: sidecar/spider

      - name: Run Spider transport and policy tests
        run: cargo test --manifest-path sidecar/spider/Cargo.toml

  emscripten-build:
    name: Compile Spider dependencies for Cloudflare Emscripten
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install beta Rust and Emscripten target
        uses: dtolnay/rust-toolchain@beta
        with:
          targets: wasm32-unknown-emscripten

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: sidecar/spider-cloudflare-worker

      - name: Diagnose Tokio feature unification
        working-directory: sidecar/spider-cloudflare-worker
        run: |
          cargo tree --target wasm32-unknown-emscripten -e features -i tokio
          cargo tree --target wasm32-unknown-emscripten -e features -i reqwest@0.13.5
          cargo tree --target wasm32-unknown-emscripten -e features -i reqwest@0.12.28

      - name: Apply narrow Emscripten compatibility patch
        run: python3 sidecar/spider-cloudflare-worker/scripts/patch-spider-fingerprint-emscripten.py

      - name: Build patched worker-build tool
        run: |
          git init /tmp/workers-rs
          git -C /tmp/workers-rs remote add origin https://github.com/cloudflare/workers-rs.git
          git -C /tmp/workers-rs fetch --depth 1 origin ed043e60b421229bfe69b4fcc5b84005854f6961
          git -C /tmp/workers-rs checkout FETCH_HEAD
          python3 sidecar/spider-cloudflare-worker/scripts/patch-worker-build-snippets.py /tmp/workers-rs/worker-build/src/build/mod.rs
          cargo install --path /tmp/workers-rs/worker-build --locked --force

      - name: Build experimental Cloudflare Worker
        working-directory: sidecar/spider-cloudflare-worker
        run: worker-build --emscripten --release

      - name: Verify generated Worker entrypoint
        run: |
          test -s sidecar/spider-cloudflare-worker/build/index.js
          test -s sidecar/spider-cloudflare-worker/build/index_bg.wasm
