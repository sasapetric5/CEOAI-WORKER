# CEOAI V5.0 — Cloudflare Workers configuration
# Dedicated CEOAI memory namespace; do not reuse other product namespaces.
name = "ceoai-worker"
main = "ceoai-index-v5.0.mjs"
compatibility_date = "2026-10-24"
workers_dev = true
# Preserve Worker variables configured in Cloudflare Dashboard during code deployments.
keep_vars = true

[vars]
ALLOWED_ORIGINS = "https://ceoai.dev"
DEBUG_PROVIDER_ERRORS = "false"
# Free-only gates (default off). Set to "true" only after confirming no billing risk.
# XAI_FREE_CONFIRMED = "false"
# NVIDIA_FREE_CONFIRMED = "false"
# HF_FREE_CONFIRMED = "false"
# JINA_READER_ENABLED = "true"

[[kv_namespaces]]
binding = "KV_MEMORY"
id = "b0837272625647779b705adccc79972b"

[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "2026102401"

[ratelimits.simple]
limit = 20
period = 60
