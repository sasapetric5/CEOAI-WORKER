# CEOAI V5.0 — Cloudflare Workers configuration
# Dedicated CEOAI memory namespace; do not reuse other product namespaces.
name = "ceoai-worker"
main = "ceoai-index-v5.0.mjs"
compatibility_date = "2026-10-24"
workers_dev = true
# Preserve Worker variables configured in Cloudflare Dashboard during code deployments.
keep_vars = true

[vars]
ALLOWED_ORIGINS = "https://ceoai.dev"
DEBUG_PROVIDER_ERRORS = "false"
# Free-only gates (default off). Set to "true" only after confirming no billing risk.
# XAI_FREE_CONFIRMED = "false"
# NVIDIA_FREE_CONFIRMED = "false"
# HF_FREE_CONFIRMED = "false"
# JINA_READER_ENABLED = "true"

[[kv_namespaces]]
binding = "KV_MEMORY"
id = "b0837272625647779b705adccc79972b"

[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "2026102401"

[ratelimits.simple]
limit = 20
period = 60

[[durable_objects.bindings]]
name = "SECURITY_DO"
class_name = "SecurityOrchestratorDO"

[[migrations]]
tag = "v1-security-orchestrator"
new_sqlite_classes = ["SecurityOrchestratorDO"]

# Existing shared Spider queue. Consumer is serialized against Browser Run quota.
[[queues.producers]]
binding = "SPIDER_QUEUE"
queue = "ceoai-spider-jobs"

[[queues.consumers]]
queue = "ceoai-spider-jobs"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 5
retry_delay = 60
dead_letter_queue = "ceoai-spider-dlq"
max_concurrency = 1

[[durable_objects.bindings]]
name = "SPIDER_LEDGER"
class_name = "SpiderJobLedgerDO"

[[migrations]]
tag = "v2-spider-job-ledger"
new_sqlite_classes = ["SpiderJobLedgerDO"]

# Per-task durable workflow checkpoints; separate from the specialized Spider ledger.
[[durable_objects.bindings]]
name = "WORKFLOW_TASKS"
class_name = "WorkflowTaskDO"

[[migrations]]
tag = "v3-workflow-task-checkpoints"
new_sqlite_classes = ["WorkflowTaskDO"]
