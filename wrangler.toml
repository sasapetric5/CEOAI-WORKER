# CEOAI V4.9 — Cloudflare Workers configuration
# Before deploying, create a Workers KV namespace and replace the placeholder ID below.
# Do not deploy while the placeholder remains.
name = "ceoai-worker"
main = "ceoai-index-v4.9.js"
compatibility_date = "2026-10-24"
workers_dev = true

[vars]
ALLOWED_ORIGINS = "https://ceoai.dev"
DEBUG_PROVIDER_ERRORS = "false"
AI_ENABLED = "false"
EXTERNAL_AI_ENABLED = "false"
WORKERS_AI_ENABLED = "false"

[[kv_namespaces]]
binding = "KV_MEMORY"
id = "REPLACE_WITH_REAL_KV_NAMESPACE_ID"

# Cloudflare rate-limit binding. namespace_id must be a positive integer unique
# within this Cloudflare account. Verify uniqueness before deployment.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "84261024"

[ratelimits.simple]
limit = 20
period = 60
