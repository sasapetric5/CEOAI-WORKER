# CEOAI V4.9 — Cloudflare Workers configuration
# Dedicated CEOAI memory namespace; do not reuse the ContentCraft API_KEYS namespace.
name = "ceoai-worker"
main = "ceoai-index-v4.9.js"
compatibility_date = "2026-10-24"
workers_dev = true

[vars]
ALLOWED_ORIGINS = "https://ceoai.dev"
DEBUG_PROVIDER_ERRORS = "false"
AI_ENABLED = "false"
EXTERNAL_AI_ENABLED = "false"
WORKERS_AI_ENABLED = "false"

[[kv_namespaces]]
binding = "KV_MEMORY"
id = "b0837272625647779b705adccc79972b"

# Cloudflare rate-limit binding. namespace_id must be a positive integer unique
# within this Cloudflare account. Chosen as a dedicated account-local ID; ensure no other Worker uses this ID before deployment.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "2026102401"

[ratelimits.simple]
limit = 20
period = 60
